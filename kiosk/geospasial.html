<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Peta Geospasial</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Poppins:wght@300;400;500&display=swap"
      rel="stylesheet"
    />

    <style>
      body {
        background: radial-gradient(circle at top, #0f2027, #203a43, #0b1a24);
        font-family: "Poppins", sans-serif;
        color: white;
        min-height: 100vh;
      }

      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 15px 40px;
        background: rgba(0, 0, 0, 0.3);
      }

      .title {
        font-family: "Orbitron";
        letter-spacing: 2px;
      }

      .btn-outline-light {
        border-radius: 8px;
        padding: 6px 16px;
      }

      .map-container {
        height: 82vh;
        margin: 20px;
        border-radius: 10px;
        overflow: hidden;
      }

      #map {
        height: 100%;
        width: 100%;
      }

      .leaflet-popup-content {
        font-family: "Poppins";
      }
    </style>
  </head>

  <body>
    <div class="header">
      <div class="title">PETA GEOSPASIAL KOTA</div>

      <div>
        <button class="btn btn-outline-light" onclick="history.back()">
          ⬅ Kembali
        </button>
      </div>
    </div>

    <div class="map-container">
      <div id="map"></div>
    </div>

    <script>
      /* INIT MAP */

      const map = L.map("map").setView([3.5826, 98.775], 12);

      /* BASEMAP */

      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        attribution: "Map data © OpenStreetMap",
      }).addTo(map);

      /* LAYER GROUP */

      const kesehatanLayer = L.layerGroup();
      const sekolahLayer = L.layerGroup();
      const kantorLayer = L.layerGroup();
      const daruratLayer = L.layerGroup();

      const kebunLayer = L.layerGroup();
      const benchmarkLayer = L.layerGroup();
      const pertanianLayer = L.layerGroup();
      const proyekLayer = L.layerGroup();
      const jalanLayer = L.layerGroup();

      /* =========================
DATA KESEHATAN
========================= */

      const kesehatan = [
        {
          nama: "RSUD Serdang Bedagai",
          alamat: "Jl. RSUD No.1 Perbaungan",
          telp: "061-123456",
          email: "rsud@health.go.id",
          lat: 3.58,
          lng: 98.87,
        },

        {
          nama: "Puskesmas Perbaungan",
          alamat: "Jl. Puskesmas Raya",
          telp: "061-334455",
          email: "puskesmaslp@health.go.id",
          lat: 3.565,
          lng: 98.865,
        },
      ];

      kesehatan.forEach((d) => {
        L.marker([d.lat, d.lng])
          .bindPopup(
            `
<b>${d.nama}</b><br>
Alamat: ${d.alamat}<br>
Telp: ${d.telp}<br>
Email: ${d.email}
`,
          )
          .addTo(kesehatanLayer);
      });

      /* =========================
DATA SEKOLAH
========================= */

      const sekolah = [
        {
          nama: "SMA Negeri 1 Perbaungan",
          alamat: "Jl. Pendidikan No.10",
          telp: "061-555777",
          email: "sman1@edu.id",
          lat: 3.575,
          lng: 98.88,
        },

        {
          nama: "SMP Negeri 2 Perbaungan",
          alamat: "Jl. Pendidikan No.12",
          telp: "061-555888",
          email: "smpn2@edu.id",
          lat: 3.57,
          lng: 98.885,
        },
      ];

      sekolah.forEach((d) => {
        L.marker([d.lat, d.lng])
          .bindPopup(
            `
<b>${d.nama}</b><br>
Alamat: ${d.alamat}<br>
Telp: ${d.telp}<br>
Email: ${d.email}
`,
          )
          .addTo(sekolahLayer);
      });

      /* =========================
DATA KANTOR
========================= */

      const kantor = [
        {
          nama: "Kantor Bupati Serdang Bedagai",
          alamat: "Jl. Negara No.1",
          telp: "061-444222",
          email: "setda@deliserdang.go.id",
          lat: 3.585,
          lng: 98.875,
        },

        {
          nama: "Dinas Kependudukan",
          alamat: "Jl. Kependudukan No.5",
          telp: "061-999333",
          email: "dukcapil@deliserdang.go.id",
          lat: 3.59,
          lng: 98.88,
        },
      ];

      kantor.forEach((d) => {
        L.marker([d.lat, d.lng])
          .bindPopup(
            `
<b>${d.nama}</b><br>
Alamat: ${d.alamat}<br>
Telp: ${d.telp}<br>
Email: ${d.email}
`,
          )
          .addTo(kantorLayer);
      });

      /* =========================
DARURAT
========================= */

      const darurat = [
        {
          nama: "Polres Serdang Bedagai",
          alamat: "Jl. Polisi No.8",
          telp: "110",
          email: "polres@polri.go.id",
          lat: 3.56,
          lng: 98.86,
        },

        {
          nama: "Pemadam Kebakaran",
          alamat: "Jl. Damkar No.3",
          telp: "113",
          email: "damkar@deliserdang.go.id",
          lat: 3.595,
          lng: 98.86,
        },
      ];

      darurat.forEach((d) => {
        L.marker([d.lat, d.lng])
          .bindPopup(
            `
<b>${d.nama}</b><br>
Alamat: ${d.alamat}<br>
Telp: ${d.telp}<br>
Email: ${d.email}
`,
          )
          .addTo(daruratLayer);
      });

      /* =========================
AREA KEBUN (POLYGON)
========================= */

      const kebun = L.polygon(
        [
          [3.6, 98.8],
          [3.61, 98.82],
          [3.59, 98.83],
          [3.58, 98.81],
        ],
        {
          color: "green",
          fillOpacity: 0.4,
        },
      )
        .bindPopup("Area Perkebunan Sawit")
        .addTo(kebunLayer);

      /* =========================
AREA PERTANIAN
========================= */

      const sawah = L.polygon(
        [
          [3.57, 98.78],
          [3.58, 98.79],
          [3.56, 98.8],
          [3.55, 98.78],
        ],
        {
          color: "yellow",
          fillOpacity: 0.4,
        },
      )
        .bindPopup("Area Pertanian Sawah")
        .addTo(pertanianLayer);

      /* =========================
BENCHMARK POINT
========================= */

      const benchmarks = [
        { nama: "BM-01 Survey", lat: 3.582, lng: 98.79 },

        { nama: "BM-02 Survey", lat: 3.59, lng: 98.78 },
      ];

      benchmarks.forEach((b) => {
        L.circleMarker([b.lat, b.lng], {
          radius: 7,
          color: "cyan",
          fillOpacity: 0.9,
        })
          .bindPopup("Benchmark: " + b.nama)
          .addTo(benchmarkLayer);
      });

      /* =========================
PROYEK INFRASTRUKTUR
========================= */

      const proyek = [
        { nama: "Pembangunan Jalan Baru", lat: 3.595, lng: 98.84 },

        { nama: "Pembangunan Jembatan", lat: 3.575, lng: 98.82 },
      ];

      proyek.forEach((p) => {
        L.marker([p.lat, p.lng])
          .bindPopup("Proyek Infrastruktur: " + p.nama)
          .addTo(proyekLayer);
      });

      /* =========================
JALUR JALAN
========================= */

      const jalan = L.polyline(
        [
          [3.58, 98.75],
          [3.59, 98.78],
          [3.6, 98.82],
          [3.61, 98.85],
        ],
        {
          color: "orange",
          weight: 4,
        },
      )
        .bindPopup("Jalur Jalan Utama")
        .addTo(jalanLayer);

      /* DEFAULT LAYER */

      kesehatanLayer.addTo(map);
      sekolahLayer.addTo(map);

      /* LAYER CONTROL */

      const overlayMaps = {
        "🏥 Fasilitas Kesehatan": kesehatanLayer,
        "🏫 Sekolah": sekolahLayer,
        "🏛 Kantor Layanan Publik": kantorLayer,
        "🚓 Keamanan & Darurat": daruratLayer,

        "🌴 Area Kebun": kebunLayer,
        "🌾 Area Pertanian": pertanianLayer,
        "📍 Benchmark Survey": benchmarkLayer,
        "🚧 Proyek Infrastruktur": proyekLayer,
        "🛣 Jalur Jalan": jalanLayer,
      };

      L.control.layers(null, overlayMaps).addTo(map);
    </script>
  </body>
</html>
