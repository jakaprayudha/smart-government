<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>PPOB Pembayaran</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Poppins:wght@300;400;500&display=swap"
      rel="stylesheet"
    />

    <style>
      body {
        background: radial-gradient(circle at top, #0f2027, #203a43, #0b1a24);
        font-family: "Poppins", sans-serif;
        color: white;
        min-height: 100vh;
      }

      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 15px 40px;
        background: rgba(0, 0, 0, 0.3);
      }

      .title {
        font-family: "Orbitron";
        letter-spacing: 2px;
      }

      .card-glass {
        background: rgba(255, 255, 255, 0.05);
        border-radius: 15px;
        padding: 20px;
        margin-top: 20px;
      }

      .module-card {
        cursor: pointer;
        transition: 0.3s;
        padding: 25px;
        text-align: center;
      }

      .module-card:hover {
        background: rgba(0, 195, 255, 0.15);
        transform: translateY(-4px);
      }

      input,
      select {
        background: #0f2530 !important;
        border: 1px solid #1f3a46 !important;
        color: white !important;
      }

      .btn-pay {
        background: linear-gradient(135deg, #00c3ff, #00ff9d);
        border: none;
        color: black;
        font-weight: 600;
      }

      .result-box {
        background: white;
        color: black;
        padding: 20px;
        border-radius: 10px;
        margin-top: 20px;
      }
    </style>
  </head>

  <body>
    <div class="header">
      <div class="title">PPOB PEMBAYARAN</div>

      <div>
        <button class="btn btn-outline-light" onclick="history.back()">
          ⬅ Kembali
        </button>
      </div>
    </div>

    <div class="container-fluid">
      <!-- MENU LAYANAN -->

      <h4 class="mt-4">💳 Pilih Layanan</h4>

      <div class="row">
        <div class="col-md-3">
          <div class="card-glass module-card" onclick="pilihLayanan('PLN')">
            <h5>⚡ Listrik PLN</h5>
          </div>
        </div>

        <div class="col-md-3">
          <div class="card-glass module-card" onclick="pilihLayanan('PDAM')">
            <h5>💧 PDAM</h5>
          </div>
        </div>

        <div class="col-md-3">
          <div class="card-glass module-card" onclick="pilihLayanan('Pulsa')">
            <h5>📱 Pulsa</h5>
          </div>
        </div>

        <div class="col-md-3">
          <div class="card-glass module-card" onclick="pilihLayanan('BPJS')">
            <h5>🏥 BPJS</h5>
          </div>
        </div>
      </div>

      <!-- FORM TAGIHAN -->

      <div id="formTagihan" class="card-glass" style="display: none">
        <h5>🔎 Cek Tagihan</h5>

        <p>Layanan: <b id="jenisLayanan"></b></p>

        <div class="row">
          <div class="col-md-4">
            <input
              id="nomorPelanggan"
              class="form-control"
              placeholder="Nomor Pelanggan"
            />
          </div>

          <div class="col-md-2">
            <button class="btn btn-pay w-100" onclick="cekTagihan()">
              Cek
            </button>
          </div>
        </div>
      </div>

      <!-- HASIL -->

      <div id="hasilTagihan" class="result-box" style="display: none">
        <h5>Detail Tagihan</h5>

        <p><b>Nama:</b> <span id="namaPelanggan"></span></p>

        <p><b>Layanan:</b> <span id="layananPelanggan"></span></p>

        <p><b>Periode:</b> <span id="periodeTagihan"></span></p>

        <p><b>Total Tagihan:</b> <span id="totalTagihan"></span></p>

        <button class="btn btn-success mt-2" onclick="bayar()">Bayar</button>

        <button class="btn btn-secondary mt-2" onclick="cetakStruk()">
          Cetak Struk
        </button>
      </div>
    </div>

    <script>
      let layananDipilih = "";

      /* PILIH LAYANAN */

      function pilihLayanan(nama) {
        layananDipilih = nama;

        document.getElementById("formTagihan").style.display = "block";

        document.getElementById("jenisLayanan").innerText = nama;
      }

      /* CEK TAGIHAN */

      function cekTagihan() {
        document.getElementById("hasilTagihan").style.display = "block";

        document.getElementById("namaPelanggan").innerText = "Budi Santoso";

        document.getElementById("layananPelanggan").innerText = layananDipilih;

        document.getElementById("periodeTagihan").innerText = "Juni 2026";

        document.getElementById("totalTagihan").innerText = "Rp 245.000";
      }

      /* BAYAR */

      function bayar() {
        alert("Pembayaran berhasil!");
      }

      /* CETAK STRUK */

      function cetakStruk() {
        var win = window.open("", "", "width=400,height=600");

        win.document.write("<h3>STRUK PEMBAYARAN</h3>");

        win.document.write("<p>Nama: Budi Santoso</p>");

        win.document.write("<p>Layanan: " + layananDipilih + "</p>");

        win.document.write("<p>Total: Rp 245.000</p>");

        win.print();
      }
    </script>
  </body>
</html>
