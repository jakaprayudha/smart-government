<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Asisten Digital</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/simple-keyboard@latest/build/css/index.css"
    />

    <script src="https://cdn.jsdelivr.net/npm/simple-keyboard@latest/build/index.js"></script>

    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Poppins:wght@300;400;500&display=swap"
      rel="stylesheet"
    />

    <style>
      body {
        background: radial-gradient(circle at top, #0f2027, #203a43, #0b1a24);
        font-family: "Poppins", sans-serif;
        color: white;
        height: 100vh;
        display: flex;
        flex-direction: column;
      }

      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 15px 40px;
        background: rgba(0, 0, 0, 0.3);
      }

      .title {
        font-family: "Orbitron";
        letter-spacing: 2px;
      }

      .chat-container {
        flex: 1;
        padding: 20px;
        overflow-y: auto;
      }

      .chat-bubble {
        padding: 12px 16px;
        border-radius: 10px;
        margin-bottom: 10px;
        max-width: 70%;
      }

      .user {
        background: #00c3ff;
        color: black;
        margin-left: auto;
      }

      .bot {
        background: #1f3a46;
      }

      .chat-input {
        display: flex;
        padding: 15px;
        background: rgba(0, 0, 0, 0.3);
      }

      .chat-input input {
        flex: 1;
        border: none;
        padding: 10px;
        border-radius: 8px;
        margin-right: 10px;
      }

      .send-btn {
        background: linear-gradient(135deg, #00c3ff, #00ff9d);
        border: none;
        padding: 10px 20px;
        border-radius: 8px;
        font-weight: bold;
      }

      .keyboard {
        margin: 10px;
      }
      /* ===== VIRTUAL KEYBOARD STYLE FIX ===== */

      .simple-keyboard {
        background: transparent;
      }

      .simple-keyboard .hg-button {
        background: #1f3a46;
        color: white;
        border-radius: 6px;
        border: 1px solid #2c5566;
        font-size: 16px;
      }

      .simple-keyboard .hg-button:hover {
        background: #00c3ff;
        color: black;
      }

      .simple-keyboard .hg-button:active {
        background: #00ff9d;
        color: black;
      }

      .simple-keyboard .hg-row {
        margin-bottom: 6px;
      }

      /* tombol spesial */

      .simple-keyboard .hg-button.hg-standardBtn.hg-button-space {
        background: #2c5566;
        color: white;
      }

      .simple-keyboard .hg-button.hg-button-enter {
        background: #00c3ff;
        color: black;
        font-weight: bold;
      }

      .simple-keyboard .hg-button.hg-button-backspace {
        background: #ff4c4c;
        color: white;
      }
    </style>
  </head>

  <body>
    <div class="header">
      <div class="title">ASISTEN DIGITAL</div>

      <div>
        <button class="btn btn-outline-light" onclick="history.back()">
          ⬅ Kembali
        </button>
      </div>
    </div>

    <div id="chat" class="chat-container">
      <div class="chat-bubble bot">
        Halo 👋 Saya Asisten Digital Pemerintah. Silakan tanyakan layanan publik
        yang Anda butuhkan.
      </div>
    </div>

    <div class="chat-input">
      <input id="userInput" placeholder="Tulis pertanyaan..." />

      <button class="send-btn" onclick="sendMessage()">Kirim</button>
    </div>

    <div class="keyboard">
      <div class="simple-keyboard"></div>
    </div>

    <script>
      function sendMessage() {
        let input = document.getElementById("userInput");

        let text = input.value.trim();

        if (text === "") return;

        addMessage(text, "user");

        let response = getBotResponse(text);

        setTimeout(() => {
          addMessage(response, "bot");
        }, 500);

        input.value = "";
        keyboard.setInput("");
      }

      function addMessage(text, type) {
        let chat = document.getElementById("chat");

        let bubble = document.createElement("div");

        bubble.className = "chat-bubble " + type;

        bubble.innerText = text;

        chat.appendChild(bubble);

        chat.scrollTop = chat.scrollHeight;
      }

      function getBotResponse(msg) {
        msg = msg.toLowerCase();

        if (msg.includes("ktp")) {
          return "Untuk membuat KTP silakan datang ke Dukcapil dengan membawa KK.";
        }

        if (msg.includes("jam layanan")) {
          return "Jam layanan kantor pemerintah adalah pukul 08:00 - 16:00.";
        }

        if (msg.includes("rumah sakit")) {
          return "Rumah sakit terdekat adalah RSUD Serdang Bedagai.";
        }

        if (msg.includes("pengaduan")) {
          return "Silakan gunakan menu Pengaduan Masyarakat pada kiosk.";
        }

        return "Maaf saya belum memahami pertanyaan Anda.";
      }

      /* VIRTUAL KEYBOARD */

      const Keyboard = window.SimpleKeyboard.default;

      const keyboard = new Keyboard({
        onChange: (input) => onChange(input),

        onKeyPress: (button) => onKeyPress(button),
      });

      function onChange(input) {
        document.getElementById("userInput").value = input;
      }

      function onKeyPress(button) {
        if (button === "{enter}") {
          sendMessage();
        }
      }
    </script>
  </body>
</html>
