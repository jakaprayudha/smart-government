<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Peta Pengaduan Masyarakat</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Poppins:wght@300;400;500&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
      body {
        background: radial-gradient(circle at top, #0f2027, #203a43, #0b1a24);
        font-family: "Poppins", sans-serif;
        color: white;
      }

      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 15px 40px;
        background: rgba(0, 0, 0, 0.3);
      }

      .title {
        font-family: "Orbitron";
        letter-spacing: 2px;
      }

      .status {
        color: #00ff9d;
      }

      .clock {
        font-size: 13px;
        color: #ccc;
      }

      .topmenu {
        background: rgba(255, 255, 255, 0.05);
        padding: 10px 40px;
      }

      .topmenu a {
        color: white;
        text-decoration: none;
        margin-right: 30px;
        font-size: 14px;
      }

      .topmenu a.active {
        color: #00c3ff;
        border-bottom: 2px solid #00c3ff;
      }

      .card-glass {
        background: rgba(255, 255, 255, 0.05);
        border-radius: 15px;
        padding: 20px;
        margin-top: 20px;
      }

      .map-box {
        height: 560px;
        border-radius: 10px;
        overflow: hidden;
      }

      .stat-number {
        font-size: 28px;
        font-weight: 600;
      }

      .alert-box {
        background: rgba(255, 0, 0, 0.2);
        border-left: 4px solid red;
        padding: 10px;
        margin-bottom: 10px;
      }
    </style>
  </head>

  <body>
    <div class="header">
      <div class="title">E-LAPOR COMMAND CENTER</div>

      <div>
        <div class="status">GIS PENGADUAN MASYARAKAT</div>
        <div id="clock" class="clock"></div>
      </div>
    </div>

    <div class="topmenu">
      <a href="index.html">Dashboard Pengaduan</a>
      <a href="data-laporan.html">Daftar Laporan</a>
      <a href="peta-pengaduan.html" class="active">Peta Pengaduan</a>
      <a href="kinerja-pengaduan.html">Kinerja Penanganan</a>
      <a href="analitk-pengaduan.html">Analitik Pengaduan</a>
      <a href="laporan-opd.html">Laporan OPD</a>
      <a href="../dashboard.html">Command Center</a>
    </div>

    <div class="container-fluid">
      <div class="row">
        <div class="col-md-9">
          <div class="card-glass">
            <h5>Peta Pengaduan Kota</h5>

            <div id="map" class="map-box"></div>
          </div>
        </div>

        <div class="col-md-3">
          <div class="card-glass">
            <h5>🚨 Laporan Prioritas</h5>

            <div id="priorityList"></div>
          </div>
        </div>
      </div>
    </div>

    <script>
      /* CLOCK */

      function updateClock() {
        const now = new Date();

        document.getElementById("clock").innerHTML =
          now.toLocaleDateString("id-ID") +
          " | " +
          now.toLocaleTimeString("id-ID");
      }

      setInterval(updateClock, 1000);
      updateClock();

      /* MAP */

      const map = L.map("map").setView([3.56, 98.86], 11);

      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png").addTo(
        map,
      );

      /* DATA OPD */

      const opd = [
        { name: "Dinas PU - Sei Rampah", lat: 3.567, lng: 98.857 },
        { name: "Dishub - Perbaungan", lat: 3.586, lng: 98.92 },
        { name: "DLH - Teluk Mengkudu", lat: 3.525, lng: 98.91 },
      ];

      opd.forEach((o) => {
        L.circleMarker([o.lat, o.lng], {
          radius: 10,
          color: "blue",
          fillColor: "blue",
          fillOpacity: 0.8,
        })
          .addTo(map)
          .bindPopup("<b>" + o.name + "</b>");
      });

      /* DATA LAPORAN */

      const laporan = [
        {
          id: "LP-001",
          pelapor: "Ahmad",
          kategori: "Infrastruktur",
          deskripsi: "Jalan berlubang besar - Perbaungan",
          lat: 3.586,
          lng: 98.92,
          opd: "Dinas PU",
          status: "Open",
          foto: "https://images.unsplash.com/photo-1503387762-592deb58ef4e",
          prioritas: true,
        },
        {
          id: "LP-002",
          pelapor: "Budi",
          kategori: "Lampu Jalan",
          deskripsi: "Lampu jalan mati - Sei Rampah",
          lat: 3.567,
          lng: 98.857,
          opd: "Dinas Perhubungan",
          status: "Process",
          foto: "https://images.unsplash.com/photo-1500530855697-b586d89ba3ee",
          prioritas: false,
        },
        {
          id: "LP-003",
          pelapor: "Siti",
          kategori: "Kebersihan",
          deskripsi: "Sampah menumpuk - Teluk Mengkudu",
          lat: 3.525,
          lng: 98.91,
          opd: "Dinas Lingkungan",
          status: "Done",
          foto: "https://images.unsplash.com/photo-1581578731548-c64695cc6952",
          prioritas: false,
        },
      ];
      function addMarker(l) {
        let color = "red";

        if (l.status === "Process") color = "orange";
        if (l.status === "Done") color = "green";
        if (l.prioritas) color = "purple";

        const marker = L.circleMarker([l.lat, l.lng], {
          radius: 10,
          color: color,
          fillColor: color,
          fillOpacity: 0.9,
        }).addTo(map);

        marker.bindPopup(
          "<b>ID:</b> " +
            l.id +
            "<br>" +
            "<b>Pelapor:</b> " +
            l.pelapor +
            "<br>" +
            "<b>Kategori:</b> " +
            l.kategori +
            "<br>" +
            "<b>Laporan:</b> " +
            l.deskripsi +
            "<br>" +
            "<b>OPD:</b> " +
            l.opd +
            "<br><br>" +
            "<img src='" +
            l.foto +
            "' width='200'>",
        );

        if (l.prioritas) {
          document.getElementById("priorityList").innerHTML +=
            "<div class='alert-box'><b>" +
            l.kategori +
            "</b><br>" +
            l.deskripsi +
            "</div>";
        }
      }

      laporan.forEach(addMarker);

      /* REALTIME SIMULATION */

      setInterval(() => {
        const newReport = {
          id: "LP-" + Math.floor(Math.random() * 900),

          pelapor: "Masyarakat",

          kategori: "Kebersihan",

          deskripsi: "Sampah menumpuk",

          lat: 3.45 + Math.random() * 0.2, // range Sergai
          lng: 98.85 + Math.random() * 0.1,

          opd: "Dinas Lingkungan",

          status: "Open",

          foto: "https://images.unsplash.com/photo-1581578731548-c64695cc6952",

          prioritas: false,
        };

        addMarker(newReport);
      }, 8000);
    </script>
  </body>
</html>
