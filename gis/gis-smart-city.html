<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Master Smart City Map</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Poppins:wght@300;400;500&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
      body {
        background: radial-gradient(circle at top, #0f2027, #203a43, #0b1a24);
        font-family: "Poppins", sans-serif;
        color: white;
      }

      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 15px 40px;
        background: rgba(0, 0, 0, 0.3);
      }

      .title {
        font-family: "Orbitron";
        letter-spacing: 2px;
      }

      .status {
        color: #00ff9d;
      }

      .clock {
        font-size: 13px;
        color: #ccc;
      }

      .topmenu {
        background: rgba(255, 255, 255, 0.05);
        padding: 10px 40px;
      }

      .topmenu a {
        color: white;
        text-decoration: none;
        margin-right: 30px;
        font-size: 14px;
      }

      .topmenu a.active {
        color: #00c3ff;
        border-bottom: 2px solid #00c3ff;
      }

      .card-glass {
        background: rgba(255, 255, 255, 0.05);
        border-radius: 15px;
        padding: 20px;
        margin-top: 20px;
      }

      .map-box {
        height: 520px;
        border-radius: 10px;
        overflow: hidden;
      }

      .stat-number {
        font-size: 26px;
        font-weight: 600;
      }
    </style>
  </head>

  <body>
    <div class="header">
      <div class="title">SMART CITY COMMAND CENTER</div>

      <div>
        <div class="status">MASTER CITY MAP</div>
        <div id="clock" class="clock"></div>
      </div>
    </div>

    <div class="topmenu">
      <div class="topmenu">
        <a href="index.html">GIS Infrastruktur</a>
        <a href="gis-drainase.html">GIS Banjir & Drainase</a>
        <a href="gis-fasilitas-publik.html">GIS Fasilitas Publik</a>
        <a href="gis-transportasi.html">GIS Transportasi</a>
        <a href="gis-digital.html">GIS Infrastruktur Digital</a>
        <a href="gis-smart-city.html" class="active">Master Smart City Map</a>
        <a href="../dashboard.html">Command Center</a>
      </div>
    </div>

    <div class="container-fluid">
      <!-- STAT -->

      <div class="row">
        <div class="col-md-2">
          <div class="card-glass">
            <h6>Sekolah</h6>
            <div class="stat-number">120</div>
          </div>
        </div>

        <div class="col-md-2">
          <div class="card-glass">
            <h6>Rumah Sakit</h6>
            <div class="stat-number">12</div>
          </div>
        </div>

        <div class="col-md-2">
          <div class="card-glass">
            <h6>UMKM</h6>
            <div class="stat-number">12,540</div>
          </div>
        </div>

        <div class="col-md-2">
          <div class="card-glass">
            <h6>BTS</h6>
            <div class="stat-number">182</div>
          </div>
        </div>

        <div class="col-md-2">
          <div class="card-glass">
            <h6>CCTV</h6>
            <div class="stat-number">240</div>
          </div>
        </div>

        <div class="col-md-2">
          <div class="card-glass">
            <h6>Titik Banjir</h6>
            <div class="stat-number">18</div>
          </div>
        </div>
      </div>

      <!-- MAP -->

      <div class="card-glass">
        <h5>Master Smart City Map</h5>

        <div id="cityMap" class="map-box"></div>
      </div>
    </div>

    <script>
      /* CLOCK */

      function updateClock() {
        const now = new Date();

        const date = now.toLocaleDateString("id-ID");

        const time = now.toLocaleTimeString("id-ID");

        document.getElementById("clock").innerHTML = date + " | " + time;
      }

      setInterval(updateClock, 1000);
      updateClock();

      /* MAP */

      const cityMap = L.map("cityMap").setView([3.56, 98.86], 11);

      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        attribution: "Smart City Map",
      }).addTo(cityMap);

      /* SEKOLAH */

      L.circleMarker([3.586, 98.92], {
        radius: 8,
        color: "blue",
        fillColor: "blue",
        fillOpacity: 0.9,
      })
        .addTo(cityMap)
        .bindPopup("SMA Negeri 1 Perbaungan");

      /* RUMAH SAKIT */

      L.circleMarker([3.567, 98.857], {
        radius: 10,
        color: "red",
        fillColor: "red",
        fillOpacity: 0.9,
      })
        .addTo(cityMap)
        .bindPopup("RSUD Serdang Bedagai");

      /* UMKM */

      L.circleMarker([3.568, 98.86], {
        radius: 8,
        color: "orange",
        fillColor: "orange",
        fillOpacity: 0.9,
      })
        .addTo(cityMap)
        .bindPopup("Sentra UMKM Perbaungan");

      /* BTS */

      L.circleMarker([3.586, 98.92], {
        radius: 10,
        color: "purple",
        fillColor: "purple",
        fillOpacity: 0.9,
      })
        .addTo(cityMap)
        .bindPopup("BTS Telkomsel");

      /* CCTV */

      L.circleMarker([3.575, 98.87], {
        radius: 8,
        color: "green",
        fillColor: "green",
        fillOpacity: 0.9,
      })
        .addTo(cityMap)
        .bindPopup("CCTV Simpang Kota");

      /* BANJIR */

      L.circleMarker([3.525, 98.91], {
        radius: 10,
        color: "cyan",
        fillColor: "cyan",
        fillOpacity: 0.9,
      })
        .addTo(cityMap)
        .bindPopup("Titik Banjir Teluk Mengkudu");
    </script>
  </body>
</html>
